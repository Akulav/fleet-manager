name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          echo "FLEETVIEW_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --workspace --release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build agent installer
        working-directory: installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" agent.iss

      - name: Build master installer
        working-directory: installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" master.iss

      - name: Stage raw executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\fleetview-agent.exe  dist\fleetview-agent.exe
          Copy-Item target\release\fleetview-master.exe dist\fleetview-master.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: FleetView ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/FleetViewAgent-Setup-*.exe
            dist/FleetViewMaster-Setup-*.exe
            dist/fleetview-agent.exe
            dist/fleetview-master.exe
